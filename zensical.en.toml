# Documentation site, ENGLISH version (user guide only: the maintainer
# reference stays in French), built by Zensical from docs/en/ and published on
# GitLab Pages under /en/. See zensical.fr.toml for the full French site; both
# are built by make_docs.sh (also run by .gitlab-ci.yml).
#
#   ./make_docs.sh              # both languages into public/
#   ./make_docs.sh serve en     # preview at http://localhost:8000
#
# Every page here translates the page of docs/fr/ found at the SAME PATH (the
# language selector relies on it). docs/en/images/ is a copy of docs/fr/images/
# made by make_docs.sh, not versioned.

[project]
site_name = "MicroPythonMCU"
site_description = "Python-programmable microcontroller (MicroPython API) for OpenModelica"
site_author = "Benoit Delaup"
site_url = "https://bdelaup.gitlab.io/modelica_micropython3/en/"
copyright = "Copyright &copy; 2026 Benoit Delaup — MIT license"
repo_url = "https://gitlab.com/bdelaup/modelica_micropython3"
repo_name = "bdelaup/modelica_micropython3"
edit_uri = "-/edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "public/en"

nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    { "Installation" = "guide/installation.md" },
    { "Getting started" = "guide/premiers-pas.md" },
    { "The MCU block" = "guide/mcu.md" },
    { "machine / time API" = "guide/api.md" },
    { "Peripherals" = [
      { "LED and display" = "guide/peripheriques/led-afficheur.md" },
      { "Serial devices (UART)" = "guide/peripheriques/uart.md" },
      { "I2C devices" = "guide/peripheriques/i2c.md" },
      { "Weighing chain (HX711)" = "guide/peripheriques/pesee.md" },
      { "Logic analyser" = "guide/peripheriques/analyseurs.md" },
      { "Radio link" = "guide/peripheriques/radio.md" },
    ] },
    { "Examples" = "guide/exemples.md" },
    { "Debugging with VS Code" = "guide/debogage.md" },
    { "Limits and troubleshooting" = "guide/limites.md" },
  ] },
  { "Maintainer reference (FR)" = "https://bdelaup.gitlab.io/modelica_micropython3/fr/interne/architecture/" },
]

[project.extra]
alternate = [
  { name = "English", link = "../en/", lang = "en" },
  { name = "Français", link = "../fr/", lang = "fr" },
]

[project.theme]
language = "en"
# SVG/PNG mirrors of the package icon (copied from docs/fr/images/).
logo = "images/logo.svg"
favicon = "images/logo.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Light theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "System theme"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
# Without this fence, ```mermaid blocks are published as raw code.
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
