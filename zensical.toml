# Site de documentation construit par Zensical à partir de docs/, publié sur
# GitLab Pages par .gitlab-ci.yml. Aperçu local (docs/publication.md) :
#
#   pip install zensical
#   zensical serve        # http://localhost:8000
#
# Toute nouvelle page de docs/ doit aussi être ajoutée à nav ci-dessous.

[project]
site_name = "MicroPythonMCU"
site_description = "Microcontrôleur programmable en Python (API MicroPython) pour OpenModelica"
site_author = "Benoit Delaup"
site_url = "https://bdelaup.gitlab.io/modelica_micropython3/"
copyright = "Lycée Jules Haag"
repo_url = "https://gitlab.com/bdelaup/modelica_micropython3"
repo_name = "bdelaup/modelica_micropython3"
edit_uri = "-/edit/main/docs/"
docs_dir = "docs"
# Dossier que GitLab Pages publie.
site_dir = "public"

nav = [
  { "Accueil" = "README.md" },
  { "Installation" = "installation.md" },
  { "Écrire un script" = [
    { "API machine / time" = "api-machine.md" },
    { "Afficheur pédagogique" = "peripherique-display.md" },
    { "Liaison série (UART)" = "peripherique-uart.md" },
    { "Périphériques série externes" = "peripheriques-uart-externes.md" },
    { "Bus I2C" = "peripheriques-i2c.md" },
    { "Chaîne de pesée (HX711)" = "peripheriques-pesee.md" },
  ] },
  { "Fonctionnement interne" = [
    { "Architecture" = "architecture.md" },
    { "Intégration de Python" = "integration-python.md" },
    { "Cycle de vie" = "cycle-de-vie.md" },
  ] },
  { "Développer la bibliothèque" = [
    { "Suite de vérification" = "tests.md" },
    { "Publier une version et la documentation" = "publication.md" },
  ] },
]

[project.theme]
language = "fr"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Thème clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Thème sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Thème du système"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
