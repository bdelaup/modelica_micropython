<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 380" width="790" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="790" height="380" fill="#ffffff"/>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e9e"/>
    </marker>
  </defs>

  <!-- Contour de l'intérieur du MCU -->
  <rect x="20" y="20" width="700" height="320" rx="8" fill="#f6f8fb" stroke="#8a94a6" stroke-dasharray="6 4"/>
  <text x="34" y="42" font-weight="600" fill="#4a5568">Intérieur du MCU : une broche (même circuit pour GP0 à GP7)</text>

  <g stroke="#222" stroke-width="2" fill="none">
    <!-- Source de l'étage de sortie -->
    <line x1="80" y1="170" x2="80" y2="197"/>
    <circle cx="80" cy="215" r="18"/>
    <line x1="80" y1="233" x2="80" y2="310"/>
    <!-- Ligne principale : source, ROut, interrupteur, noeud -->
    <line x1="80" y1="170" x2="140" y2="170"/>
    <rect x="140" y="161" width="56" height="18" fill="#ffffff"/>
    <line x1="196" y1="170" x2="246" y2="170"/>
    <line x1="250" y1="170" x2="292" y2="150"/>
    <line x1="304" y1="170" x2="720" y2="170"/>
    <!-- Tirage haut : rail VOH, interrupteur, résistance -->
    <line x1="355" y1="70" x2="405" y2="70"/>
    <line x1="380" y1="70" x2="380" y2="76"/>
    <line x1="380" y1="104" x2="396" y2="80"/>
    <line x1="380" y1="108" x2="380" y2="112"/>
    <rect x="371" y="112" width="18" height="40" fill="#ffffff"/>
    <line x1="380" y1="152" x2="380" y2="170"/>
    <!-- Tirage bas : interrupteur, résistance, masse -->
    <line x1="380" y1="170" x2="380" y2="186"/>
    <line x1="380" y1="190" x2="396" y2="214"/>
    <line x1="380" y1="218" x2="380" y2="226"/>
    <rect x="371" y="226" width="18" height="50" fill="#ffffff"/>
    <line x1="380" y1="276" x2="380" y2="310"/>
    <!-- Capteur de tension -->
    <line x1="530" y1="170" x2="530" y2="222"/>
    <circle cx="530" cy="240" r="18"/>
    <line x1="530" y1="258" x2="530" y2="310"/>
    <!-- Rail de masse -->
    <line x1="80" y1="310" x2="530" y2="310"/>
    <line x1="300" y1="310" x2="300" y2="330"/>
  </g>
  <!-- Contacts des interrupteurs et noeuds -->
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <circle cx="248" cy="170" r="3"/>
    <circle cx="302" cy="170" r="3"/>
    <circle cx="380" cy="78" r="3"/>
    <circle cx="380" cy="106" r="3"/>
    <circle cx="380" cy="188" r="3"/>
    <circle cx="380" cy="216" r="3"/>
  </g>
  <g fill="#222">
    <circle cx="380" cy="170" r="4"/>
    <circle cx="530" cy="170" r="4"/>
    <circle cx="300" cy="310" r="4"/>
    <circle cx="380" cy="310" r="4"/>
  </g>
  <!-- Signes de la source et du voltmètre -->
  <text x="80" y="212" text-anchor="middle" font-size="15" fill="#222">+</text>
  <text x="80" y="228" text-anchor="middle" font-size="15" fill="#222">−</text>
  <text x="530" y="245" text-anchor="middle" font-size="15" font-weight="600" fill="#222">V</text>

  <!-- Connecteurs GPx et GND sur le bord du bloc -->
  <rect x="712" y="162" width="16" height="16" fill="#1f4e9e"/>
  <text x="736" y="175" font-weight="600" fill="#1f4e9e">GPx</text>
  <rect x="292" y="332" width="16" height="16" fill="#ffffff" stroke="#1f4e9e" stroke-width="2"/>
  <text x="316" y="345" font-weight="600" fill="#1f4e9e">GND</text>

  <!-- Légendes -->
  <g fill="#222">
    <text x="104" y="203">src</text>
    <text x="104" y="219" fill="#4a5568">VOH / VOL</text>
    <text x="104" y="235" fill="#4a5568">0 V en entrée</text>
    <text x="168" y="152" text-anchor="middle">ROut</text>
    <text x="168" y="196" text-anchor="middle" fill="#4a5568">100 Ω</text>
    <text x="276" y="136" text-anchor="middle">sw</text>
    <text x="276" y="196" text-anchor="middle" fill="#4a5568">fermé en sortie</text>
    <text x="276" y="212" text-anchor="middle" fill="#4a5568">ouvert : 1 GΩ</text>
    <text x="412" y="74">VOH</text>
    <text x="406" y="98">PULL_UP</text>
    <text x="398" y="134">RPullUp</text>
    <text x="398" y="150" fill="#4a5568">50 kΩ</text>
    <text x="406" y="208">PULL_DOWN</text>
    <text x="398" y="248">RPullDown</text>
    <text x="398" y="264" fill="#4a5568">50 kΩ</text>
    <text x="554" y="226">sns</text>
  </g>

  <!-- Lectures par le programme -->
  <line x1="548" y1="240" x2="580" y2="240" stroke="#1f4e9e" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="586" y="245" fill="#1f4e9e">v</text>
  <g fill="#1f4e9e" font-size="12">
    <text x="548" y="266">v &gt; 1,4 V : Pin.value(), IRQ</text>
    <text x="548" y="282">v brute : ADC.read_u16()</text>
  </g>

  <!-- Commandes venant du programme -->
  <g fill="#1f4e9e" font-size="12">
    <text x="34" y="74">Commandé par le programme :</text>
    <text x="34" y="92">• src et sw : Pin.OUT / Pin.IN, PWM, UART</text>
    <text x="34" y="110">• tirages : Pin(n, mode, pull), I2C()</text>
  </g>
</svg>
