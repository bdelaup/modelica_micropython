<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -155 320 280" width="480" height="420" font-family="sans-serif">
  <rect x="-160" y="-155" width="320" height="280" fill="white"/>

  <!-- Corps du microcontrôleur -->
  <rect x="-70" y="-90" width="140" height="168" fill="rgb(60,60,60)" stroke="black" stroke-width="0.5"/>
  <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="20">Pico</text>
  <text x="0" y="27" text-anchor="middle" dominant-baseline="middle" fill="rgb(200,200,200)" font-size="8.5">RP2040 (v0)</text>

  <!-- Nom d'instance (comme %name résolu, ex. dans un schéma) -->
  <text x="0" y="-120" text-anchor="middle" dominant-baseline="middle" fill="rgb(0,0,255)" font-size="26">pico</text>

  <!-- Broches GPIO : carré bleu plein = PositivePin, étiquette alignée à droite -->
  <g fill="black" font-size="17">
    <rect x="93" y="-77" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="-70" text-anchor="end" dominant-baseline="middle">GP0</text>
    <rect x="93" y="-57" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="-50" text-anchor="end" dominant-baseline="middle">GP1</text>
    <rect x="93" y="-37" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="-30" text-anchor="end" dominant-baseline="middle">GP2</text>
    <rect x="93" y="-17" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="-10" text-anchor="end" dominant-baseline="middle">GP3</text>
    <rect x="93" y="3" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="10" text-anchor="end" dominant-baseline="middle">GP4</text>
    <rect x="93" y="23" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="30" text-anchor="end" dominant-baseline="middle">GP5</text>
    <rect x="93" y="43" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="50" text-anchor="end" dominant-baseline="middle">GP6</text>
    <rect x="93" y="63" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="65" y="70" text-anchor="end" dominant-baseline="middle">GP7</text>
  </g>

  <!-- Broche GND : carré blanc à bord bleu = NegativePin -->
  <rect x="-5" y="82" width="10" height="10" fill="white" stroke="rgb(0,0,255)" stroke-width="1"/>
  <text x="0" y="96" text-anchor="middle" dominant-baseline="middle" fill="black" font-size="9">GND</text>
</svg>
