<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -140 200 240" width="460" height="552" font-family="sans-serif">
  <rect x="-100" y="-140" width="200" height="240" fill="white"/>

  <!-- Nom d'instance (comme %name résolu, ex. dans un schéma) -->
  <text x="0" y="-120" text-anchor="middle" dominant-baseline="middle" fill="rgb(0,0,255)" font-size="26">mcu</text>

  <!-- Corps du microcontrôleur -->
  <rect x="-55" y="-65" width="110" height="130" fill="rgb(60,60,60)" stroke="black" stroke-width="0.5"/>
  <text x="0" y="-8" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="20" font-weight="bold">MCU</text>
  <text x="0" y="11" text-anchor="middle" dominant-baseline="middle" fill="rgb(200,200,200)" font-size="11">(v0)</text>

  <!-- Broches GPIO gauche (GP0-GP3) : carré bleu plein = PositivePin, étiquette en blanc alignée à gauche -->
  <g fill="white" font-size="12">
    <rect x="-69" y="-57" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="-46" y="-50" text-anchor="start" dominant-baseline="middle">GP0</text>
    <rect x="-69" y="-27" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="-46" y="-20" text-anchor="start" dominant-baseline="middle">GP1</text>
    <rect x="-69" y="13" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="-46" y="20" text-anchor="start" dominant-baseline="middle">GP2</text>
    <rect x="-69" y="43" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="-46" y="50" text-anchor="start" dominant-baseline="middle">GP3</text>
  </g>

  <!-- Broches GPIO droite (GP4-GP7) : carré bleu plein = PositivePin, étiquette en blanc alignée à droite -->
  <g fill="white" font-size="12">
    <rect x="55" y="-57" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="46" y="-50" text-anchor="end" dominant-baseline="middle">GP4</text>
    <rect x="55" y="-27" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="46" y="-20" text-anchor="end" dominant-baseline="middle">GP5</text>
    <rect x="55" y="13" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="46" y="20" text-anchor="end" dominant-baseline="middle">GP6</text>
    <rect x="55" y="43" width="14" height="14" fill="rgb(0,0,255)"/>
    <text x="46" y="50" text-anchor="end" dominant-baseline="middle">GP7</text>
  </g>

  <!-- Broche GND (bas) : carré blanc à bord bleu = NegativePin -->
  <rect x="-6" y="72" width="12" height="12" fill="white" stroke="rgb(0,0,255)" stroke-width="1"/>
  <text x="0" y="90" text-anchor="middle" dominant-baseline="middle" fill="black" font-size="8">GND</text>
</svg>
