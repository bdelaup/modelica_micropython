<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="400" height="400" font-family="'Trebuchet MS', 'Segoe UI', sans-serif">
  <!-- Miroir du logo/icône de package MicroPythonMCU.mo (mêmes coordonnées, y inversé) : chip + broches GPIO + LED embarquée + "µPy" -->

  <!-- Corps du microcontrôleur -->
  <rect x="-55" y="-65" width="110" height="130" fill="rgb(60,60,60)" stroke="black" stroke-width="0.5"/>

  <!-- Broches GPIO gauche (GP0-GP3) -->
  <rect x="-69" y="-57" width="14" height="14" fill="rgb(0,0,255)"/>
  <rect x="-69" y="-27" width="14" height="14" fill="rgb(0,0,255)"/>
  <rect x="-69" y="13" width="14" height="14" fill="rgb(0,0,255)"/>
  <rect x="-69" y="43" width="14" height="14" fill="rgb(0,0,255)"/>

  <!-- Broches GPIO droite (GP4-GP7) -->
  <rect x="55" y="-57" width="14" height="14" fill="rgb(0,0,255)"/>
  <rect x="55" y="-27" width="14" height="14" fill="rgb(0,0,255)"/>
  <rect x="55" y="13" width="14" height="14" fill="rgb(0,0,255)"/>
  <rect x="55" y="43" width="14" height="14" fill="rgb(0,0,255)"/>

  <!-- Broche GND (bas) -->
  <rect x="-6" y="72" width="12" height="12" fill="white" stroke="rgb(0,0,255)" stroke-width="1"/>

  <!-- LED embarquée (GP25), allumée -->
  <circle cx="0" cy="-40" r="6" fill="rgb(0,200,0)" stroke="black" stroke-width="0.5"/>

  <!-- Marque centrale -->
  <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="38" font-weight="bold">µPy</text>
</svg>
